<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>持股有事叫我</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 深色單欄流程（與持股健康儀表板同一套視覺）；頂部步驟條、底部固定操作列；手機優先，桌機最寬 860px */
:root {
  --bg: #0e1116; --panel: #161a21; --panel-2: #1d222b; --line: #2a313c;
  --fg: #e9edf2; --muted: #98a2b3; --accent: #f05a6b; --accent-bg: rgba(240,90,107,.14);
  --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; --na: #64748b;
  --ok-bg: rgba(34,197,94,.14); --warn-bg: rgba(245,158,11,.14); --bad-bg: rgba(239,68,68,.14); --na-bg: rgba(100,116,139,.18);
  --c1: #60a5fa; --c2: #a78bfa; --c3: #2dd4bf; --c4: #f472b6; --c5: #facc15; --c6: #475163;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; } body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 860px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px 10px; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; border-left: 2px solid var(--accent); padding-left: 8px; line-height: 1.2; }
.brand span { color: var(--muted); font-size: 12px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; padding: 0; list-style: none; }
.steps button { all: unset; cursor: pointer; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.steps button::before { content: ""; height: 3px; border-radius: 2px; background: var(--line); }
.steps button[aria-current="step"] { color: var(--fg); font-weight: 500; }
.steps button[aria-current="step"]::before, .steps button.done::before { background: var(--accent); }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
main .wrap { padding-block: 20px 110px; display: grid; gap: 16px; }
h2 { font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-size: 16px; margin: 0; font-weight: 500; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.code { font-family: var(--mono); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
input, select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.btn { font: inherit; font-size: 14px; border-radius: 8px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 500; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: default; }
/* step 1 */
.hrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hrow .full { grid-column: 1 / -1; }
.hrow .foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
/* step 2 */
.qhead { display: grid; gap: 6px; }
.qcount { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.qrow { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.qrow:first-of-type { border-top: 0; padding-top: 0; }
.qrow-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); font-weight: 500; }
.chip .sug { color: var(--muted); font-size: 11px; margin-left: 4px; }
/* step 3：儀表板 */
.d-head { display: grid; gap: 6px; }
.d-head h2 { font-size: 22px; }
.take { margin: 0; font-size: 15px; line-height: 1.65; max-width: 46rem; }
.asof { color: var(--muted); font-size: 12.5px; }
.strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.strip a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 14px; }
.strip a:focus-visible { outline: 2px solid var(--accent); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--na); box-shadow: 0 0 0 3px var(--na-bg); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); } .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); } .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile .lb { color: var(--muted); font-size: 12px; }
.tile .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.35; margin-top: 2px; }
.tile .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.hold { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 10px; }
.hc { border: 1px solid var(--line); border-top: 4px solid var(--na); border-radius: 10px; padding: 12px; display: grid; gap: 8px; align-content: start; background: var(--panel-2); scroll-margin-top: 120px; }
.hc.ok { border-top-color: var(--ok); background: linear-gradient(var(--ok-bg), transparent 60%), var(--panel-2); }
.hc.warn { border-top-color: var(--warn); background: linear-gradient(var(--warn-bg), transparent 60%), var(--panel-2); }
.hc.bad { border-top-color: var(--bad); background: linear-gradient(var(--bad-bg), transparent 60%), var(--panel-2); }
.hc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hc-name { font-weight: 500; }
.hc-code { color: var(--muted); font-size: 12px; margin-left: 6px; font-family: var(--mono); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #0b0d10; background: var(--na); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .55; }
.pill.ok { background: var(--ok); } .pill.warn { background: var(--warn); } .pill.bad { background: var(--bad); color: #fff; } .pill.na { color: #fff; }
.hc-act { font-weight: 500; }
.hc-why { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.55; }
.hc-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-variant-numeric: tabular-nums; font-size: 14px; }
.hc-nums div { display: grid; gap: 1px; min-width: 0; }
.hc-nums span:first-child { color: var(--muted); font-size: 11.5px; }
.up { color: var(--ok); } .dn { color: var(--bad); } .mu { color: var(--muted); }
.wbar { display: flex; gap: 2px; height: 28px; }
.wbar i { border-radius: 4px; min-width: 3px; }
.wleg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.wleg span { display: inline-flex; align-items: center; gap: 6px; }
.wleg b { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 10px; }
.rule { display: grid; gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); }
.rule:first-child { border-top: 0; padding-top: 0; }
.rule-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.track { position: relative; height: 8px; background: #262c36; border-radius: 4px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: #475163; }
.track i.hit { background: var(--bad); }
.track s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #cbd5e1; }
.rule-txt { font-size: 12px; color: var(--muted); }
ul.lst { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: 14px; line-height: 1.55; }
.ev { display: grid; grid-template-columns: 3.4rem 1fr; gap: 8px 10px; font-size: 13px; line-height: 1.5; }
.ev .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.ev .src { color: var(--muted); }
.ip { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; margin-right: 6px; white-space: nowrap; }
.ip.pos { background: var(--ok-bg); color: var(--ok); } .ip.neg { background: var(--bad-bg); color: var(--bad); } .ip.neu { background: var(--na-bg); color: #cbd5e1; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.5; }
td.r, th.r { text-align: right; }
.mail { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.mail .subj { background: var(--panel-2); padding: 10px 12px; font-size: 14px; font-weight: 500; }
.mail .body { padding: 12px; font-size: 14px; display: grid; gap: 8px; }
.mail .body p { margin: 0; }
.alert { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 14px; margin: 0; }
.demo-note { padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--line); color: var(--muted); font-size: 12.5px; margin: 0; }
/* hero */
.hero { display: grid; gap: 10px; padding-bottom: 4px; }
.hero h2 { font-size: 24px; line-height: 1.35; }
.flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; counter-reset: f; }
.flow li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; line-height: 1.45; counter-increment: f; }
.flow li::before { content: counter(f); display: block; font-family: var(--mono); color: var(--accent); font-size: 12px; margin-bottom: 2px; }
.hero-cta { display: flex; gap: 8px; flex-wrap: wrap; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
/* 模擬通知 */
.notif { all: unset; box-sizing: border-box; cursor: pointer; position: fixed; z-index: 20; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); width: min(420px, calc(100% - 24px)); transform: translateX(-50%); display: grid; gap: 3px; padding: 12px 14px; border-radius: 16px; background: rgba(40,46,58,.96); border: 1px solid #3a4250; box-shadow: 0 12px 32px rgba(0,0,0,.5); color: var(--fg); }
.notif[hidden] { display: none; }
.notif.inpage { position: absolute; top: 90px; }
.notif:focus-visible { outline: 2px solid var(--accent); }
.n-app { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.n-ico { width: 20px; height: 20px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 10px; display: grid; place-items: center; font-weight: 700; }
.n-time { margin-left: auto; }
.n-subj { font-size: 14px; font-weight: 500; line-height: 1.45; }
.n-hint { font-size: 11.5px; color: var(--warn); }
@media (prefers-reduced-motion: no-preference) { .notif.show { animation: drop .45s cubic-bezier(.2,.9,.3,1.2); } @keyframes drop { from { transform: translate(-50%, -140%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } } }
dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(640px, calc(100% - 24px)); max-height: calc(100dvh - 48px); overflow: auto; }
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-head { position: sticky; top: 0; background: var(--panel); display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); z-index: 1; }
#mailDlgBody, #promptDlgBody { padding: 14px; display: grid; gap: 12px; }
.dlg-foot { padding: 0 14px 14px; }
.dlg-foot .btn { width: 100%; }
/* step 4 */
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; }
.tabs button[aria-selected="true"] { border-color: var(--fg); font-weight: 500; }
textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; width: 100%; min-height: 320px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; resize: vertical; }
.copied { font-size: 13px; color: var(--ok); }
footer.bar { position: fixed; inset: auto 0 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
footer.bar .wrap { padding-block: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
footer.bar .privacy { font-size: 12px; color: var(--muted); }
@media (max-width: 420px) { .hc-nums { font-size: 13px; } .tile .big { font-size: 21px; } }
@media (prefers-reduced-motion: no-preference) { .panel { animation: in .2s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>持股有事叫我</h1><span>範例・資料 2026-10-19</span></div>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<footer class="bar">
  <div class="wrap">
    <span class="privacy">貼給你的 AI，它會問你 3 個問題</span>
    <button class="btn primary" id="openSheet" type="button">複製 prompt</button>
  </div>
</footer>

<button class="notif" id="notif" type="button" hidden aria-label="打開通知範例">

<dialog id="promptDlg" aria-labelledby="promptDlgT">
  <div class="dlg-head"><h3 id="promptDlgT">複製 prompt，交給你的 AI</h3><button class="btn ghost" type="button" data-close>關閉</button></div>
  <div id="promptDlgBody"></div>
</dialog>

  function interviewPrompt() {
    return `你是我的持股論點檢查助理。我是長期投資人。你的工作是依我自己寫下的理由和條件，判斷理由還成不成立、條件有沒有被觸發；不給買賣建議，也不預測股價。

【一、訪談】為了節省對話次數，分三輪問，每輪一次問完所有持股：
第 1 輪：請我照這個格式列出所有持股（成本和定期定額可以不填，但有填才算得出損益）：
  代號 股數 總成本（每月定額金額）

      2884 2000股 成本80000
第 2 輪：問下面三題。如果你的介面能顯示可點選的選項（按鈕、單選、問卷元件），就用它出題，盡量一次問完多題，選項最後加一個「自己寫」；不能顯示才改成文字，請我每檔回一行，例如「NVDA A/A/30；2884 D/C/不加碼」。
  題 1 為什麼買？A 看好產業長期趨勢｜B 公司競爭力強、對手追不上｜C 參與整體市場成長｜D 穩定領股息｜E 還不確定
  題 2 發生什麼事會停扣或檢討？A 產業需求轉弱｜B 營收或獲利連續衰退｜C 配息明顯減少｜D 不賣，只看加碼時機｜E 還不確定
  題 3 距一年最高收盤跌多少想多買一點？10｜20｜30｜不加碼（%）。台股 ETF 看加權指數、美股 ETF 看 S&P 500；個股要理由仍成立才算觸發。
第 3 輪：整理成【設定表】（代號、持有理由、檢討條件、加碼條件、追蹤事件、目前燈號），一次給我確認或修改。我選 E 的，在表裡提出 2–3 個常見選項讓我挑；追蹤事件依持股類型建議，例如 AI 半導體看雲端大廠資本支出、台積電月營收，ETF 看大盤距高點，金融股看自結盈餘、配息、合併或增資。

【二、判斷規則】

- 數字：台股用當日收盤，美股用前一個交易日收盤；損益與比重換算台幣，匯率用同一天的美元兌台幣並註明。
- 誠實：每個數字和事件都附來源與日期；查不到就寫「未取得」並說明哪個來源讀不到，不推測、不編造。

【三、資料來源】依序使用，前一個讀不到才用下一個：
- 台股收盤：臺灣證券交易所 → Yahoo 奇摩股市
- 美股收盤、一年高點：Yahoo Finance
- 台股重大訊息、月營收、自結盈餘、法說會：公開資訊觀測站 → 公司投資人關係網站
- 美股財報：SEC EDGAR（8-K 財報新聞稿）→ 公司投資人關係網站
- 新聞與法說重點：用你的搜尋功能，優先官方公告與主流財經媒體；只摘要並附連結與日期，不轉貼全文
使用限制：只讀公開頁面，不登入、不繞過驗證或付費牆、不大量抓取。
我可以指定或排除來源（例如「法說會改看某網站」「不要用某網站」），請照做並寫進設定表。

【四、做不到的事】先告訴我，不要硬做：即時報價（只用收盤）、需要登入或付費的內容（例如部分法說逐字稿）、有機器人驗證的網站、付費資料庫才有的數據（例如盤中籌碼明細）。

主旨：【持股監控】{財報／法說／重大事件／加碼條件}：{一句話說明發生什麼事}
1. 結論：我設定的條件有沒有被觸發
2. 各檔燈號：有變化的寫出前後
3. 重點：數字與事實，附來源與發布時間
4. 對論點的意義：對照我的持有理由與檢討條件，附收盤價與距一年高點
5. 接下來要看：最多 3 個日期，預估的標「預估」

重點（工商時報，2026/10/16）：前 9 月獲利 318.5 億元、EPS 1.95 元，創同期新高。
